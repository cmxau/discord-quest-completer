name: Release

# Builds the Windows installers + portable zip, the macOS dmgs (Apple Silicon and Intel) and the Linux
# packages, and attaches them all to one DRAFT GitHub release.
#   - push a tag such as `v26.10.0`, or
#   - run the workflow manually and enter the tag to create.
# Review the draft, then publish it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v26.10.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows }
          - { os: macos-latest, name: macos-arm64 }
          - { os: macos-15-intel, name: macos-x64 }
          - { os: ubuntu-22.04, name: linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            runner

      - name: Install Linux system libraries
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # Ship the newest game list as the offline fallback. Keep the committed copy if this fails.
      - name: Refresh the bundled game list
        continue-on-error: true
        shell: bash
        run: |
          curl -fsSL --retry 3 -o gamelist.new.json "https://discord.com/api/v10/applications/detectable"
          jq -e 'type == "array" and length > 1000' gamelist.new.json > /dev/null
          mv gamelist.new.json src/assets/gamelist.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the dummy game runner
        if: matrix.name == 'windows'
        run: pnpm sync:runner

      # Runs `pnpm build` first (beforeBuildCommand), then produces the platform's installers.
      - name: Build the app
        run: pnpm tauri build

      - name: Create the portable zip
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $release = "src-tauri/target/release"
          $name = "discord-quest-completer-win-x64-$env:TAG"
          New-Item -ItemType Directory -Force -Path "portable/$name" | Out-Null
          Copy-Item "$release/discord-quest-completer.exe" "portable/$name/"
          Copy-Item "$release/data" "portable/$name/data" -Recurse
          Copy-Item "$release/resources" "portable/$name/resources" -Recurse
          Copy-Item LICENSE, README.md "portable/$name/"
          Compress-Archive -Path "portable/$name" -DestinationPath "portable/$name.zip"

      - name: Upload Windows files
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: files-windows
          path: |
            portable/*.zip
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Upload macOS files
        if: startsWith(matrix.name, 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: files-${{ matrix.name }}
          path: src-tauri/target/release/bundle/dmg/*.dmg

      - name: Upload Linux files
        if: matrix.name == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: files-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage

  # One job creates the release so the platform builds can't race to make several drafts.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: files-*
          path: dist-files
          merge-multiple: true

      - name: Create the draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Discord Quest Completer ${{ env.TAG }}
          draft: true
          generate_release_notes: true
          body: |
            ### Downloads
            - **Windows:** `*-setup.exe` (recommended), `.msi`, or the portable `discord-quest-completer-win-x64-*.zip` (extract it somewhere you can write to).
            - **macOS:** `*_aarch64.dmg` (Apple Silicon) or `*_x64.dmg` (Intel). The builds are not signed or notarized: right-click the app and choose Open the first time.
            - **Linux:** `.deb`, `.rpm` or `.AppImage`. Untested.

            ### Disclaimer
            This tool is intended for educational purposes and personal use. Please respect Discord's terms of service and game publishers' rights. The authors are not liable for any damages, account suspensions or other consequences of using this software. Use at your own risk. This project is not affiliated with, endorsed by, or connected to Discord.
          files: dist-files/**
